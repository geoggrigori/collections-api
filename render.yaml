# Render blueprint — provisiona web + worker + Postgres + Redis.
# Importe em https://dashboard.render.com (New > Blueprint).
databases:
  - name: collections-api-db
    plan: free

services:
  - type: keyvalue
    name: collections-api-redis
    plan: free
    ipAllowList: []

  - type: web
    name: collections-api
    runtime: ruby
    plan: free
    buildCommand: "bundle install && bundle exec rails db:prepare"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: collections-api-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: collections-api-redis
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production

  - type: worker
    name: collections-api-worker
    runtime: ruby
    plan: free
    buildCommand: "bundle install"
    startCommand: "bundle exec sidekiq -C config/sidekiq.yml"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: collections-api-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: collections-api-redis
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
