# Render blueprint (plano free) — web + Postgres + Redis.
# No plano free nao ha worker dedicado, entao os jobs rodam in-process
# (ACTIVE_JOB_ADAPTER=async). Importe em https://dashboard.render.com
# (New > Blueprint) e informe RAILS_MASTER_KEY quando solicitado.
databases:
  - name: collections-api-db
    plan: free

services:
  - type: keyvalue
    name: collections-api-redis
    plan: free
    ipAllowList: []

  - type: web
    name: collections-api
    runtime: ruby
    plan: free
    healthCheckPath: /up
    buildCommand: "bundle install"
    startCommand: "bundle exec rails db:prepare && bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: collections-api-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: collections-api-redis
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: ACTIVE_JOB_ADAPTER
        value: async
      - key: SEED_INVOICES
        value: "3000"
      - key: SECRET_KEY_BASE
        generateValue: true
